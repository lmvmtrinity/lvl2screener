# Versioned Trivy policy for the `container-scan` CI job (.github/workflows/ci.yml).
#
# The gate is enforced: a new HIGH/CRITICAL image vulnerability fails the build. Anything listed
# here has been explicitly reviewed and accepted, and every entry carries an `expired_at` so the
# acceptance lapses on its own and the CVE fails the build again unless it is re-reviewed. Prefer
# fixing over ignoring -- most findings are stale base images, and bumping the pinned base tag or
# adding the package upgrade to the runtime stage is the real fix.
#
# This file is wired only into the scanner image scan. The api and web images are expected to scan
# completely clean, so nothing here can silently mask a finding in them.
#
# ---------------------------------------------------------------------------------------------
# Reviewed 2026-08-31.
#
# All entries below are Debian `trixie` packages inherited from the `python:3.13-slim` base image
# that have NO fixed version available from Debian security -- they cannot be resolved by the
# `apt-get upgrade` already in services/scanner/Dockerfile, nor by moving to a newer base tag.
#
# Reachability: the scanner container's entrypoint is `uvicorn app.main:app`. It runs as a
# non-root user, on an internal Compose network with no host port published (see the
# verify:compose trust-boundary check), and its only input is authenticated JSON from the api
# service. None of perl, gzip, ncurses, libacl or sqlite3 is invoked by the application or
# reachable from that request path -- they are transitively present because they are `Essential`
# or are linked by the CPython standard library.
#
# Re-review when these expire: check whether Debian has published fixes, and drop the entries
# that have been fixed rather than extending the date wholesale.
# ---------------------------------------------------------------------------------------------

vulnerabilities:
  # perl-base -- Essential:yes in Debian; cannot be removed without breaking dpkg. Perl is never
  # executed by the scanner service.
  - id: CVE-2026-13221
    statement: "perl-base, no Debian fix available; perl is never executed in this image."
    expired_at: 2026-11-30
