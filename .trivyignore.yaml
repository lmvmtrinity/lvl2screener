  # ncurses (libncursesw6 / libtinfo6 / ncurses-base / ncurses-bin) -- pulled in as a base
  # dependency; the service has no TTY and never renders a terminal UI.
  - id: CVE-2025-69720
    statement: "ncurses, no Debian fix available; the service has no TTY and does not use ncurses."
    expired_at: 2026-11-30
  # libsqlite3-0 -- linked by CPython's stdlib `sqlite3` module. The scanner persists nothing; all
  # state lives in Postgres, and `sqlite3` is never imported.
  - id: CVE-2026-11822
    statement: "libsqlite3-0, no Debian fix available; the scanner never imports sqlite3."
    expired_at: 2026-11-30
  - id: CVE-2026-11824
    statement: "libsqlite3-0, no Debian fix available; the scanner never imports sqlite3."
    expired_at: 2026-11-30

  # gzip / libacl1 -- base utilities, not invoked by the service.
  - id: CVE-2026-41992
    statement: "gzip, no Debian fix available; gzip is never invoked by the service."
    expired_at: 2026-11-30
  - id: CVE-2026-54369
    statement: "libacl1, no Debian fix available; the service does not manipulate POSIX ACLs."
    expired_at: 2026-11-30

  # libsystemd0 / libudev1 -- base libraries inherited from Debian; systemd-homed is not
  # present/running and systemd is never invoked by the scanner service.
  - id: CVE-2026-16742
    statement: "libsystemd0/libudev1, no Debian fix available; systemd is never invoked by the service."
    expired_at: 2026-11-30

  # util-linux (util-linux / mount / login / libuuid1 / fdisk / bsdutils) -- base utilities inherited
  # from Debian; the service runs unprivileged (tsxscanner), does not mount filesystems, and never
  # invokes nsenter, mount helpers, or login utilities.
  - id: CVE-2026-76642
    statement: "util-linux, no Debian fix available; the service never executes mount helpers or runs privileged hooks."
    expired_at: 2026-11-30
  - id: CVE-2026-78408
    statement: "util-linux, no Debian fix available; the service does not invoke nsenter or join cgroups."
    expired_at: 2026-11-30
  - id: CVE-2026-78409
    statement: "util-linux, no Debian fix available; the service does not perform mounts."
    expired_at: 2026-11-30
  - id: CVE-2026-78410
    statement: "util-linux, no Debian fix available; the service does not perform bind mounts."
    expired_at: 2026-11-30
