# W5 Phase B: same as security-headers.conf plus HSTS, since this is only ever served over TLS
# (apps/web/nginx.remote.conf). See that file's comment for why `add_header` has to be
# re-included per location rather than declared once.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;
