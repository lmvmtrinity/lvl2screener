# W5 Phase B: TLS-terminating front door for the optional "remote" Compose profile. Mounted over
# /etc/nginx/conf.d/default.conf on the `web-remote` service (see docker-compose.yml) -- same
# image and static bundle as the default profile's `web` service, different server block. Unlike
# nginx.conf this listens on an unprivileged TLS port (8443) so the unprivileged nginx image never
# needs a bind capability; map it to whatever public port you want in docker-compose.yml /
# REMOTE_PORT.
# W5 Phase B: request-body-size limit and per-IP rate limit at the edge, ahead of the API's own
# bodyLimit/rate-limit layer (apps/api/src/app.ts, apps/api/src/auth/remote-auth-plugin.ts).
# `limit_req_zone` is only valid in the `http` context, which is why it's declared here (this file
# is included from /etc/nginx/nginx.conf's `http { include /etc/nginx/conf.d/*.conf; }`) rather
# than inside the `server` block below.
limit_req_zone $binary_remote_addr zone=remote_api:10m rate=10r/s;

server {
  listen 8443 ssl;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:2m;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 512k;

  location /api/ {
    include /etc/nginx/security-headers.remote.conf;
    limit_req zone=remote_api burst=20 nodelay;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "no-store" always;
  }

  location /health/ {
    include /etc/nginx/security-headers.remote.conf;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }

  location /metrics {
    include /etc/nginx/security-headers.remote.conf;
    limit_req zone=remote_api burst=5 nodelay;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }

  location /ws {
    include /etc/nginx/security-headers.remote.conf;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
  }

  location / {
    include /etc/nginx/security-headers.remote.conf;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
    include /etc/nginx/security-headers.remote.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
