# W5: shared response headers, `include`d into every location block. nginx's `add_header` does
# NOT inherit into a location that defines its own `add_header` (each location below sets its own
# Cache-Control), so these are included explicitly rather than declared once at the server level.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;
